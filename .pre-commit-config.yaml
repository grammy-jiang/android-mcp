minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: host-lock
        name: Validate offline host uv.lock
        entry: uv lock --check --offline --project host
        language: system
        pass_filenames: false
        always_run: true
      - id: host-ruff-lint
        name: Ruff lint (locked)
        entry: uv run --project host --locked --group dev ruff check host/src host/tests scripts
        language: system
        pass_filenames: false
        always_run: true
      - id: host-ruff-format
        name: Ruff format (locked)
        entry: uv run --project host --locked --group dev ruff format --check host/src host/tests scripts
        language: system
        pass_filenames: false
        always_run: true
      - id: host-mypy
        name: Mypy strict Host (locked)
        entry: uv run --project host --locked --group dev mypy --config-file host/pyproject.toml host/src
        language: system
        pass_filenames: false
        always_run: true
      - id: host-bandit
        name: Bandit medium-and-higher (locked)
        entry: uv run --project host --locked --group dev bandit -q -r host/src -ll
        language: system
        pass_filenames: false
        always_run: true
      - id: host-fast-tests
        name: Host unit/contract/coverage gate
        entry: bash scripts/check-host.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

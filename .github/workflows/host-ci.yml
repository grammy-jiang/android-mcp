name: Host CI (macOS + Linux)

on:
  push:
    branches: [main]
    paths:
      - "host/**"
      - "contracts/**"
      - "scripts/check-host.sh"
      - "scripts/check-host-package.sh"
      - "scripts/check_quality_policy.py"
      - "scripts/dev.py"
      - "scripts/smoke_host_live.py"
      - "quality-policy.json"
      - ".pre-commit-config.yaml"
      - ".github/workflows/host-ci.yml"
      - "docs/host-*.md"
      - "docs/quality.md"
      - "docs/security.md"
      - "AGENTS.md"
  pull_request:
    paths:
      - "host/**"
      - "contracts/**"
      - "scripts/check-host.sh"
      - "scripts/check-host-package.sh"
      - "scripts/check_quality_policy.py"
      - "scripts/dev.py"
      - "scripts/smoke_host_live.py"
      - "quality-policy.json"
      - ".pre-commit-config.yaml"
      - ".github/workflows/host-ci.yml"
      - "docs/host-*.md"
      - "docs/quality.md"
      - "docs/security.md"
      - "AGENTS.md"

permissions:
  contents: read

concurrency:
  group: host-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.24"
      - name: Install selected Python
        run: uv python install ${{ matrix.python }}
      - name: Locked environment for selected Python
        run: uv sync --locked --group dev --python ${{ matrix.python }}
      - name: Full Host gate (type, security, branch coverage, policy, doctor)
        run: HOST_PYTHON="${{ matrix.python }}" bash ../scripts/check-host.sh

  package:
    name: Clean package installation (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.24"
      - name: Build sdist + wheel and verify clean installation
        run: HOST_PYTHON=3.13 bash scripts/check-host-package.sh

  security:
    name: Lockfile dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.24"
      - name: Audit complete Host dependency graph
        run: uv audit --project host --locked

name: Host CI (macOS + Linux)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13", "3.14"]
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.24"
      - name: Install Python
        run: uv python install ${{ matrix.python }}
      - name: Sync locked dev environment
        run: uv sync --locked --group dev --python ${{ matrix.python }}
      - name: Ruff lint
        run: uv run --locked --python ${{ matrix.python }} ruff check src tests
      - name: Ruff format
        run: uv run --locked --python ${{ matrix.python }} ruff format --check src tests
      - name: Pytest (hardware-free)
        run: uv run --locked --python ${{ matrix.python }} pytest -q
      - name: CLI doctor (no tablet)
        run: uv run --locked --python ${{ matrix.python }} android-mcp-host doctor

name: Native Kotlin JVM CI (no Android SDK)

on:
  push:
    paths:
      - "android/**"
      - "contracts/**"
      - "scripts/check-native.sh"
      - "scripts/check-native-apk.sh"
      - "scripts/smoke-native-jvm.py"
      - "host/pyproject.toml"
      - "host/uv.lock"
      - ".github/workflows/native-jvm-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "contracts/**"
      - "scripts/check-native.sh"
      - "scripts/check-native-apk.sh"
      - "scripts/smoke-native-jvm.py"
      - "host/pyproject.toml"
      - "host/uv.lock"
      - ".github/workflows/native-jvm-ci.yml"

permissions:
  contents: read

jobs:
  native-jvm:
    name: Kotlin protocol / Python wire smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.24"
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: JVM contract tests and cross-language HTTP MCP validation
        run: bash scripts/check-native.sh

  native-apk:
    name: Android debug APK / lint / permissions (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK API 36 with preaccepted runner licenses
        run: |
          test -n "$ANDROID_HOME"
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build, lint, sign and verify least-privilege APK
        run: bash scripts/check-native-apk.sh

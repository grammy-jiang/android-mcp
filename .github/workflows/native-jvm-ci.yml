name: Native Kotlin JVM CI (no Android SDK)

on:
  push:
    paths:
      - "android/**"
      - "contracts/**"
      - "scripts/check-native.sh"
      - "scripts/smoke-native-jvm.py"
      - "host/pyproject.toml"
      - "host/uv.lock"
      - ".github/workflows/native-jvm-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "contracts/**"
      - "scripts/check-native.sh"
      - "scripts/smoke-native-jvm.py"
      - "host/pyproject.toml"
      - "host/uv.lock"
      - ".github/workflows/native-jvm-ci.yml"

permissions:
  contents: read

jobs:
  native-jvm:
    name: Kotlin protocol / Python wire smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.24"
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: JVM contract tests and cross-language HTTP MCP validation
        run: bash scripts/check-native.sh

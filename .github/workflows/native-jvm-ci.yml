name: Native Kotlin JVM CI (no Android SDK)

on:
  push:
    paths:
      - "android/**"
      - "contracts/**"
      - "scripts/check-native.sh"
      - "scripts/check-native-apk.sh"
      - "scripts/smoke-native-jvm.py"
      - "host/pyproject.toml"
      - "host/uv.lock"
      - ".github/workflows/native-jvm-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - "contracts/**"
      - "scripts/check-native.sh"
      - "scripts/check-native-apk.sh"
      - "scripts/smoke-native-jvm.py"
      - "host/pyproject.toml"
      - "host/uv.lock"
      - ".github/workflows/native-jvm-ci.yml"

permissions:
  contents: read

jobs:
  native-jvm:
    name: Kotlin protocol / Python wire smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.13.4"
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: JVM contract tests and cross-language HTTP MCP validation
        run: bash scripts/check-native.sh

  native-apk:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: Android debug APK / lint / permissions (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Install SDK API 36 with preaccepted runner licenses
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Build, lint, sign and verify least-privilege APK
        run: bash scripts/check-native-apk.sh
      - name: Store private debug APK for approved hardware validation
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-mcp-native-n1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

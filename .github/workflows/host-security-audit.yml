name: Scheduled Host dependency security audit

on:
  schedule:
    # Every Monday 17:17 UTC; independent of repository changes and PRs.
    - cron: "17 17 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-scheduled-security-audit
  cancel-in-progress: false

jobs:
  host-security:
    name: Locked Host dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.4"
      - name: Audit locked Host dependencies against current advisories
        run: uv audit --project host --locked

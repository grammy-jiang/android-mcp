[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "android-mcp-host"
version = "0.1.0"
description = "Cross-platform macOS/Linux ADB host runtime for Android MCP."
requires-python = ">=3.11,<3.15"
dependencies = ["fastmcp==4.1.2", "cryptography>=46,<51", "defusedxml==0.7.1"]

[project.scripts]
android-mcp-host = "android_mcp_host.cli:main"

[dependency-groups]
dev = [
    "bandit>=1.9,<2",
    "hypothesis>=6.140,<7",
    "jsonschema>=4.25,<5",
    "mypy>=1.18,<2",
    "pre-commit>=4.0,<5",
    "pytest>=9.1,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<0.18",
]
security = ["pip-audit>=2.9,<3"]

[tool.uv]
required-version = ">=0.13.4,<0.14"

[tool.hatch.build.targets.wheel]
packages = ["src/android_mcp_host"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "PIE", "RET", "DTZ", "T10"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["android_mcp_host"]
omit = ["*/android_mcp_host/__main__.py", "*/android_mcp_host/__init__.py"]

[tool.coverage.report]
show_missing = true
